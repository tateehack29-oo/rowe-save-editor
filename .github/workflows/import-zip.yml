name: Import website ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract website files
        shell: bash
        run: |
          set -euo pipefail
          unzip -n "ROWE-Save-Editor-v0.7-GitHub.zip" -x ".github/*"
          test -f dist/index.html
          test -f dist/mon-templates.bin

      - name: Save files to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist scripts tests docs README.md .gitignore requirements-research.txt
          if git diff --cached --quiet; then
            echo "Website files already imported."
          else
            git commit -m "Import ROWE Save Editor v0.7"
            git push origin HEAD:main
          fi
