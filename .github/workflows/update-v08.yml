name: Update TATEEHACK v0.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply update
        shell: bash
        run: |
          set -euo pipefail
          unzip -p "TATEEHACK-ROWE-v0.8-update.zip" apply-update.py > "$RUNNER_TEMP/apply-rowe-update.py"
          python3 "$RUNNER_TEMP/apply-rowe-update.py" "TATEEHACK-ROWE-v0.8-update.zip"
          node --check dist/app.mjs
          node --check dist/bag.mjs
          node --check dist/bag-ui.mjs
          node tests/core.test.mjs

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist tests README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update TATEEHACK bag editor v0.8"
            git push origin HEAD:main
          fi
